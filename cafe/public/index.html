<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>평강교회 카페</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#faf7f2;--card:#fff;--tx:#2a2420;--mu:#8a7f75;--ac:#d9531e;--ac2:#fde6da;--ok:#2e8b57;--bd:#e8e0d6;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1815;--card:#26221e;--tx:#f3ece4;--mu:#a09488;--ac:#ff7a45;--ac2:#3a2519;--ok:#5fc08a;--bd:#3a342e;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif}
nav{display:flex;gap:6px;padding:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--bd)}
nav button{flex:1;padding:12px;border:0;border-radius:10px;background:var(--card);color:var(--tx);font-size:16px;font-weight:600;cursor:pointer}
nav button.on{background:var(--ac);color:#fff}
main{max-width:980px;margin:0 auto;padding:14px}
h2{margin:4px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.item:active{transform:scale(.97)}
.item .e{font-size:40px;aspect-ratio:1;display:flex;align-items:center;justify-content:center}.item .pic{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;background:var(--ac2)}.item .n{font-weight:600;margin-top:6px}.item .p{color:var(--mu);font-size:14px}
.cart{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-top:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0}
.q button{width:32px;height:32px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:18px;cursor:pointer}
.big{width:100%;padding:16px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:18px;font-weight:700;cursor:pointer;margin-top:10px}
.big:disabled{opacity:.4}
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.t{background:var(--card);border:2px solid var(--ac);border-radius:14px;padding:12px}
.t.done{border-color:var(--bd);opacity:.6}
.t h3{margin:0 0 6px;display:flex;justify-content:space-between}
.t small{color:var(--mu)}
.t button{margin-top:8px;width:100%;padding:10px;border:0;border-radius:8px;background:var(--ok);color:#fff;font-weight:600;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.stat b{display:block;font-size:24px;color:var(--ac)}.stat span{color:var(--mu);font-size:13px}
.bar{height:10px;background:var(--ac2);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.ghost{padding:10px 14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer}
input{padding:12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ok);color:#fff;padding:14px 22px;border-radius:12px;font-weight:700;display:none;z-index:9}
.mu{color:var(--mu)}
.cat{margin:18px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--ac);font-size:20px}

/* ===== 디자인 다듬기 ===== */
main{max-width:1180px}
#order:not([hidden]){display:grid;grid-template-columns:1fr;gap:6px 18px}
#order>h2{font-size:24px;margin:6px 0 2px}
.grid{grid-template-columns:repeat(var(--n,3),1fr);gap:14px}
.cat{margin:16px 0 10px;padding:0 0 0 12px;border:0;border-left:5px solid var(--ac);font-size:20px}
.item{padding:0 0 14px;border-radius:18px;overflow:hidden;box-shadow:0 2px 8px rgba(60,40,20,.08);transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column;align-items:stretch}
.item:hover{box-shadow:0 6px 16px rgba(60,40,20,.14)}
.item:active{transform:scale(.96)}
.item .pic{border-radius:0}
.item .e{font-size:54px;background:var(--ac2);width:100%}
.item .n{font-size:16px;font-weight:700;margin:12px 10px 2px;line-height:1.3;word-break:keep-all}
.item .p{color:var(--ac);font-weight:700;font-size:16px}
.cart{border-radius:18px;padding:18px;box-shadow:0 2px 8px rgba(60,40,20,.08)}
.cart .row{border-bottom:1px dashed var(--bd);padding:9px 0}
.cart .row:last-of-type{border-bottom:0}
.q button{width:38px;height:38px;font-size:20px}
.big{height:60px;font-size:20px;border-radius:14px;margin-top:14px}
.tickets{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.t{border-radius:18px;font-size:17px;line-height:1.6;box-shadow:0 2px 8px rgba(60,40,20,.08)}
.t h3{font-size:24px;color:var(--ac)}
.t button{padding:14px;font-size:16px;border-radius:10px}
.stat{border-radius:18px;box-shadow:0 2px 8px rgba(60,40,20,.08)}
@media (min-width:900px){
 #order:not([hidden]){grid-template-columns:minmax(0,1fr) 370px;align-items:start}
 #order>h2{grid-column:1/-1}
 #order>.cart{position:sticky;top:14px;margin-top:0}
}
@media (max-width:600px){
 .grid{grid-template-columns:repeat(2,1fr);gap:10px}
 main{padding:10px}
 .item .e{font-size:44px}
 .stats{grid-template-columns:1fr}
}

/* 모든 메뉴 카드 크기 동일 + 사진 정사각형 */
.grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.item{width:100%}
.item .pic,.item .e{width:100%;aspect-ratio:1/1;height:auto;object-fit:cover;flex:none}
.item .n{min-height:2.6em;display:flex;align-items:center;justify-content:center;text-align:center}
@media (max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* 메뉴 카드 자체를 정사각형으로: 사진이 카드 전체, 이름/가격은 아래에 겹쳐 표시 */
.item{position:relative;aspect-ratio:1/1;padding:0;justify-content:flex-end;align-items:stretch;background:var(--ac2)}
.item .pic,.item .e{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;object-fit:cover}
.item .e{font-size:64px;padding-bottom:28%}
.item::after{content:"";position:absolute;left:0;right:0;bottom:0;height:55%;background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.72));pointer-events:none}
.item .n,.item .p{position:relative;z-index:2;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.item .n{min-height:0;display:block;margin:0 10px 2px;font-size:17px}
.item .p{margin:0 10px 12px;font-size:15px;color:#ffd9c7}
@media (max-width:600px){.item .n{font-size:15px;margin:0 8px 2px}.item .p{margin:0 8px 8px;font-size:14px}.item .e{font-size:50px}}

/* ===== 어른도 잘 보이게: 큰 글씨 + 진한 대비, 색상 2가지 ===== */
:root[data-theme="white"]{--bg:#ffffff;--card:#ffffff;--tx:#000000;--mu:#2b2b2b;--ac:#000000;--ac2:#e9e9e9;--ok:#1f1f1f;--bd:#8a8a8a;color-scheme:light}
:root[data-theme="black"]{--bg:#000000;--card:#121212;--tx:#ffffff;--mu:#e0e0e0;--ac:#ffffff;--ac2:#333333;--ok:#ffffff;--bd:#707070;color-scheme:dark}
:root[data-theme="black"] .big,:root[data-theme="black"] .t button,:root[data-theme="black"] .toast{color:#000}
body{font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased}
main{padding-top:58px}
h2{font-size:26px}
.mu,.t small,.stat span{color:var(--mu)}
.item{border:2px solid var(--bd)}
.t,.stat,.cart{border-color:var(--bd)}
.item::after{height:60%;background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.82))}
.item .n{font-size:21px;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.item .p{font-size:19px;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.cat{font-size:24px;font-weight:800}
.cart{border:2px solid var(--bd);font-size:19px}
.cart .row{font-size:19px}
#sum{font-size:26px;color:var(--ac)}
.q button{width:44px;height:44px;font-size:24px;font-weight:700;border:2px solid var(--ac);color:var(--ac)}
.big{height:68px;font-size:24px;font-weight:800}
.t{font-size:20px;border-width:3px}
.t h3{font-size:30px}
.t button{font-size:19px;font-weight:700}
.stat b{font-size:30px}.stat span{font-size:16px}
input{font-size:20px}.ghost{font-size:17px;font-weight:600;border:2px solid var(--bd)}
.toast{font-size:22px;padding:18px 28px}
#themeSw{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:20;display:flex;gap:6px;background:var(--card);border:2px solid var(--bd);border-radius:999px;padding:4px}
#themeSw button{display:flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--tx);font:700 15px inherit;font-family:inherit;padding:8px 12px;border-radius:999px;cursor:pointer}
#themeSw button i{width:18px;height:18px;border-radius:50%;display:inline-block;border:2px solid rgba(0,0,0,.25)}
#themeSw button[data-t="white"] i{background:#fff;border-color:#000}#themeSw button[data-t="black"] i{background:#000;border-color:#888}
#themeSw button.on{background:var(--ac2);outline:2px solid var(--ac)}
@media (max-width:600px){.item .n{font-size:17px}.item .p{font-size:16px}h2{font-size:21px}}

/* ===== v2: 세련된 교회 카페 느낌 (명조 제목 + 깔끔한 본문, 작고 단정하게) ===== */
:root[data-theme="white"]{--bg:#faf8f3;--gold:#9a7424}
:root[data-theme="black"]{--bg:#0d0d0d;--card:#181818;--gold:#d8b46a}
body{font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.5}
h2,.cat,.brand b,#sum,.t h3,.cart>b{font-family:"Gowun Batang","Noto Serif KR",serif}
#top{max-width:1180px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--bd);position:relative}
#top::after{content:"";position:absolute;left:16px;right:16px;bottom:-4px;height:1px;background:var(--gold);opacity:.7}
.brand{display:flex;align-items:center;gap:10px;color:var(--gold)}
.brand b{display:block;font-size:22px;font-weight:700;color:var(--tx);line-height:1.2}
.brand small{display:block;font-size:12px;color:var(--mu);letter-spacing:.02em}
:root{padding-top:0}
main{padding-top:14px}
#themeSw{position:static;padding:3px;border-width:1px;gap:2px}
#themeSw button{font-size:13px;padding:6px 10px;font-weight:600}
#themeSw button i{width:14px;height:14px}
#themeSw button.on{outline:0;background:var(--tx);color:var(--bg)}
#order>h2{font-size:20px;font-weight:700;margin:2px 0 0}
h2{font-size:20px}
.cat{font-size:19px;font-weight:700;margin:14px 0 10px;padding:0;border:0;display:flex;align-items:center;gap:12px}
.cat::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold)}
.cat::after{content:"";flex:1;height:1px;background:var(--gold);opacity:.55}
.grid{gap:12px}
.item{border:1px solid var(--bd);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.item::after{height:52%;background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.78))}
.item .n{font-size:17px;font-weight:700;margin:0 11px 1px;letter-spacing:-.01em}
.item .p{font-size:14px;font-weight:600;margin:0 11px 11px;opacity:.95}
.cart{border:1px solid var(--bd);border-radius:14px;padding:14px 16px;font-size:15px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cart>b{font-size:18px}
.cart .row{font-size:15px;padding:8px 0}
.q{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.q button{width:28px;height:28px;font-size:16px;font-weight:600;border:1px solid var(--bd);color:var(--tx);background:transparent;padding:0;line-height:1}
#sum{font-size:20px;color:var(--tx)}
.big{height:52px;font-size:17px;font-weight:700;border-radius:12px;margin-top:12px;letter-spacing:.02em}
.t{border-width:1px;border-top:3px solid var(--tx);font-size:16px;border-radius:12px}
.t h3{font-size:22px;color:var(--tx)}
.t button{padding:10px;font-size:15px;font-weight:600}
.stat{border-radius:12px;padding:12px 14px}.stat b{font-size:24px;color:var(--tx)}.stat span{font-size:13px}
.ghost,input{font-size:15px}.ghost{border-width:1px}
.toast{font-size:18px;padding:14px 22px;border-radius:12px}
#foot{text-align:center;color:var(--mu);font-size:12px;padding:18px 0 calc(18px + env(safe-area-inset-bottom,0px));font-family:"Gowun Batang",serif}
@media (max-width:600px){.brand b{font-size:19px}.brand small{display:none}.item .n{font-size:15px;margin:0 9px 1px}.item .p{font-size:13px;margin:0 9px 9px}}

/* ===== v3: 밝은 메뉴 카드 (위 사진 + 아래 밝은 글씨판, 전체는 정사각형) ===== */
.item{background:var(--card);justify-content:flex-end;align-items:stretch;overflow:hidden}
.item::after{display:none}
.item .pic,.item .e{position:absolute;inset:0 0 auto 0;width:100%;height:64%;aspect-ratio:auto;object-fit:cover;border-bottom:2px solid var(--gold)}
.item .e{display:flex;align-items:center;justify-content:center;padding:0;font-size:52px;background:var(--ac2)}
.item .n,.item .p{position:relative;z-index:1;text-align:center;text-shadow:none;margin:0;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .n{color:var(--tx);font-size:16px;font-weight:700;line-height:1.3;min-height:0;display:block}
.item .p{color:var(--gold);font-size:14px;font-weight:700;margin-bottom:9px;opacity:1}
.item .n{margin-top:0}
.item .n{padding-top:0}
@media (max-width:600px){.item .n{font-size:14px;padding:0 6px}.item .p{font-size:13px}.item .e{font-size:42px}}

/* v4: 장바구니는 메뉴 아래 */
#order:not([hidden]){display:block;max-width:820px;margin:0 auto}
@media (min-width:900px){
 #order:not([hidden]){display:block}
 #order>.cart{position:static;margin-top:18px}
}

 return PAGES.includes(last)?last:"order";

 const hash=(location.hash||"").replace(/^#\/?/,"");
 const last=(location.pathname.split("/").filter(Boolean).pop()||"");
 return PAGES.includes(hash)||PAGES.includes(last);
}
function show(v,lock){
 document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.v===v));
 PAGES.forEach(x=>$("#"+x).hidden=x!==v);
 $("nav").hidden=!!lock;
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.v,false));
function route(){show(pageFromUrl(),kioskLock())}
route();addEventListener("hashchange",route);
// 메뉴
$("#menu").innerHTML=["음료","베이커리"].map(c=>`<h3 class="cat">${c}</h3><div class="grid" >`+MENU.map((m,i)=>m[4]===c?`<button class="item" data-i="${i}">${imgTag(m)}<div class="n">${m[0]}</div><div class="p">${won(m[2])}</div></button>`:"").join("")+`</div>`).join("");
$("#menu").onclick=e=>{const b=e.target.closest(".item");if(!b)return;cart[b.dataset.i]=(cart[b.dataset.i]||0)+1;drawCart()};
function drawCart(){
 const ks=Object.keys(cart);let sum=0;
 $("#cart").innerHTML=ks.length?ks.map(k=>{const m=MENU[k],q=cart[k];sum+=m[2]*q;
  return `<div class="row"><span>${m[1]} ${m[0]}</span><span class="q"><button data-k="${k}" data-d="-1">−</button> ${q} <button data-k="${k}" data-d="1">+</button></span><span>${won(m[2]*q)}</span></div>`}).join(""):"비어 있어요";
 $("#sum").textContent=won(sum);$("#go").disabled=!ks.length}
$("#cart").onclick=e=>{const b=e.target.closest("button");if(!b)return;const k=b.dataset.k;cart[k]+=+b.dataset.d;if(cart[k]<=0)delete cart[k];drawCart()};
// 저장소: db 우선, 없으면 메모리
const local=[];let localCb=null;
function emit(){orders=[...orders].sort((a,b)=>a.ts-b.ts);render()}
function setSync(msg){["#sync","#syncOrder"].forEach(id=>{const el=$(id);if(el)el.textContent=msg})}
function withTimeout(p,ms,msg){
 return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(msg)),ms))])}
function fbHint(e){
 const t=String((e&&e.code)||"")+" "+String((e&&e.message)||e||"");
 if(/PERMISSION_DENIED|permission_denied/i.test(t))
  return "Realtime Database 규칙에서 orders 읽기/쓰기를 허용해 주세요.";
 if(/SERVICE_DISABLED|not been used|unavailable|timeout|시간 초과/i.test(t))
  return "Realtime Database에 연결하지 못했습니다. 인터넷과 databaseURL을 확인하세요.";
 return "주문 저장 실패: "+((e&&e.message)||e);
}
function initFb(){coll=window.fbColl;
 coll.onSnapshot(s=>{orders=s.docs.map(d=>({id:d.id,...d.data()}));emit();setSync("")},e=>setSync())}
if(window.fbColl)initFb();else addEventListener("fb-ready",initFb);
setTimeout(()=>{if(!coll)setSync("⚠ Firebase 불러오기 실패 (인터넷 확인)")},8000);
$("#go").onclick=async()=>{
 const ks=Object.keys(cart);if(!ks.length){alert("메뉴를 먼저 선택하세요");return}
 const btn=$("#go");btn.disabled=true;btn.textContent="주문 전송 중…";
 const items=ks.map(k=>({name:MENU[k][0],price:MENU[k][2],qty:cart[k]}));
 const total=items.reduce((a,i)=>a+i.price*i.qty,0);
 const ts=Date.now(),num=(orders.length?Math.max(...orders.map(o=>o.num||0)):0)+1;
 const o={num,items,total,status:"new",ts};
 try{
  if(coll)await withTimeout(coll.doc(String(ts)).set(o),12000,"전송 시간 초과");
  else{orders.push({id:String(ts),...o});emit()}
 }
 catch(e){alert(fbHint(e));btn.disabled=false;btn.textContent="주문하기";return}
 cart={};drawCart();btn.textContent="주문하기";
 const t=$("#toast");t.textContent=`주문 완료! 번호 ${num}번`;t.style.display="block";setTimeout(()=>t.style.display="none",2500)};
// 실시간 / 관리자 렌더
function render(){
 const act=[...orders].reverse();
 $("#tickets").innerHTML=act.length?act.map(o=>`<div class="t ${o.status==="done"?"done":""}"><h3><span>#${o.num}</span><small>${new Date(o.ts).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}</small></h3>${o.items.map(i=>`<div>${i.name} × ${i.qty}</div>`).join("")}<small>${won(o.total)}</small>${o.status==="done"?"<div class='mu'>✔ 완료</div>":`<button data-id="${o.id}">제조 완료</button>`}</div>`).join(""):"<p class='mu'>들어온 주문이 없어요</p>";
 const tot=orders.reduce((a,o)=>a+o.total,0),n=orders.length;
 $("#s1").textContent=won(tot);$("#s2").textContent=n;$("#s3").textContent=won(n?Math.round(tot/n):0);
 const by={};orders.forEach(o=>o.items.forEach(i=>{by[i.name]=by[i.name]||{q:0,r:0};by[i.name].q+=i.qty;by[i.name].r+=i.qty*i.price}));
 const rows=Object.entries(by).sort((a,b)=>b[1].q-a[1].q),mx=rows.length?rows[0][1].q:1;
 $("#rank").innerHTML=rows.length?rows.map(([k,v])=>`<div class="row"><span style="width:110px">${k}</span><div class="bar" style="flex:1"><i style="width:${v.q/mx*100}%"></i></div><span>${v.q}개 · ${won(v.r)}</span></div>`).join(""):"<p class='mu'>아직 판매 내역이 없어요</p>"}
$("#tickets").onclick=async e=>{const b=e.target.closest("button");if(!b)return;
 try{if(coll)await coll.doc(b.dataset.id).update({status:"done"});else{orders.find(o=>o.id===b.dataset.id).status="done";render()}}catch(x){alert(x.message)}};
$("#login").onclick=()=>{if($("#pin").value==="1234"){$("#lock").hidden=true;$("#dash").hidden=false}else alert("PIN이 틀렸어요")};
$("#reset").onclick=async()=>{if(!confirm("모든 주문 기록을 삭제할까요?"))return;
 try{if(coll)await Promise.all(orders.map(o=>coll.doc(o.id).delete()));else{orders=[];render()}}catch(x){alert(x.message)}};
// 색상 2가지 선택 (기기에 기억)
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("theme",t)}catch(e){}
 document.querySelectorAll("#themeSw button").forEach(b=>b.classList.toggle("on",b.dataset.t===t))}
document.querySelectorAll("#themeSw button").forEach(b=>b.onclick=()=>setTheme(b.dataset.t));
let savedTheme="white";try{savedTheme=localStorage.getItem("theme")||"white"}catch(e){}
setTheme(savedTheme==="black"?"black":"white");
render();drawCart();
</script></body></html>
